name: Notify - Announcement

on:
  repository_dispatch:
    types: [send-announcement]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: .github/scripts
      - run: node send-fcm.js
        working-directory: .github/scripts
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          NOTIFY_TOPIC: announcements
          NOTIFY_TITLE: ${{ github.event.client_payload.title }}
          NOTIFY_BODY: ${{ github.event.client_payload.body }}
